plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bonako.aioffice'
    compileSdk 34

    defaultConfig {
        applicationId "com.bonako.aioffice"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de debug para poderes instalar sem
            // criares uma keystore. Chega para uso pessoal.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // BiometricPrompt + CryptoObject. O AppCompatActivity já estende
    // FragmentActivity, que é o que o BiometricPrompt exige.
    implementation 'androidx.biometric:biometric:1.1.0'
}
